# Mesma lógica de isolamento aplicada aos labs (via
# app/providers/kubernetes_provider.py::build_network_policy_manifest),
# só que aqui protegendo o PRÓPRIO namespace da plataforma: nenhum pod
# de lab consegue iniciar conexão de saída para cá, mesmo que a
# NetworkPolicy do namespace do lab fosse (por engano ou bug) mais
# permissiva do que deveria — defesa em profundidade nos dois lados.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress-from-lab-namespaces
  namespace: vantage-range-platform
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: vantage.io/lab-instance-id
                operator: DoesNotExist
      # Só aceita ingress de namespaces que NÃO tenham o label
      # vantage.io/lab-instance-id — ou seja, exclui por definição
      # qualquer namespace de laboratório.
